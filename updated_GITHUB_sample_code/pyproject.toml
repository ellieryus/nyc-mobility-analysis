[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "updated-github-sample-code"
version = "0.1.0"
description = "Tree/ensemble modeling + hypothesis testing on teammate sample dataset"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
