name: updated-sample-ci
on:
  push:
    paths:
      - "updated_GITHUB_sample_code/**"
  pull_request:
    paths:
      - "updated_GITHUB_sample_code/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: updated_GITHUB_sample_code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke run
        run: python pipelines/run_pipeline.py
